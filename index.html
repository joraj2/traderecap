<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f3" />
  <meta name="description" content="TradeRecap — log trades, find your edge, build your playbook. For stocks, options, futures, and crypto." />
  <title>TradeRecap - Trading Journal</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="candlestick-chart"></i></div>
        <div class="brand-text">
          <div class="brand-name">TradeRecap</div>
          <div class="brand-sub">Trading Journal</div>
        </div>
      </div>
      <div class="nav-label">TRADING JOURNAL</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="import-btn"><i data-lucide="upload"></i><span>Import data</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn btn-icon mobile-menu-btn" id="mobile-menu-btn" title="Menu" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="top-actions">
          <button class="btn btn-ghost desktop-only" id="import-top-btn"><i data-lucide="upload"></i><span>Import</span></button>
          <button class="btn btn-ghost desktop-only" id="export-btn"><i data-lucide="download"></i><span>Export</span></button>
          <button class="btn btn-ghost desktop-only" id="report-btn"><i data-lucide="file-text"></i><span>Report</span></button>
          <button class="btn btn-icon" id="settings-btn" title="Settings" aria-label="Settings"><i data-lucide="settings"></i></button>
          <button class="btn btn-primary" id="add-trade-btn" title="Add trade" aria-label="Add trade"><i data-lucide="plus"></i><span class="desktop-only">Add Trade</span></button>
        </div>
      </header>
      <section class="content" id="content"></section>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <button class="fab" id="fab-add-trade" title="Add trade" aria-label="Add trade"><i data-lucide="plus"></i></button>

  <script src="js/store.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/stat-card.js"></script>
  <script src="js/components/calendar-grid.js"></script>
  <script src="js/components/chart.js"></script>
  <script src="js/components/trade-row.js"></script>
  <script src="js/components/trade-form.js"></script>
  <script src="js/components/quick-log.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/tabs/today.js"></script>
  <script src="js/tabs/calendar.js"></script>
  <script src="js/tabs/trades.js"></script>
  <script src="js/tabs/analytics.js"></script>
  <script src="js/tabs/watchlist.js"></script>
  <script src="js/tabs/alerts.js"></script>
  <script src="js/tabs/patterns.js"></script>
  <script src="js/tabs/premarket.js"></script>
  <script src="js/tabs/review.js"></script>
  <script src="js/tabs/mistakes.js"></script>
  <script src="js/tabs/macro.js"></script>
  <script src="js/tabs/notes.js"></script>
  <script src="js/tabs/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
