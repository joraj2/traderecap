<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1211"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="rgba(34,197,94,0.18)" stroke-width="2"/>

  <!-- Candlestick chart with rising trend -->
  <g filter="url(#glow)">
    <!-- Wicks -->
    <line x1="120" y1="320" x2="120" y2="380" stroke="#ef4444" stroke-width="3"/>
    <line x1="180" y1="280" x2="180" y2="350" stroke="#ef4444" stroke-width="3"/>
    <line x1="240" y1="220" x2="240" y2="310" stroke="url(#green)" stroke-width="3"/>
    <line x1="300" y1="180" x2="300" y2="270" stroke="url(#green)" stroke-width="3"/>
    <line x1="360" y1="130" x2="360" y2="220" stroke="url(#green)" stroke-width="3"/>

    <!-- Bodies -->
    <rect x="105" y="332" width="30" height="36" rx="3" fill="#ef4444"/>
    <rect x="165" y="295" width="30" height="40" rx="3" fill="#ef4444"/>
    <rect x="225" y="240" width="30" height="58" rx="3" fill="url(#green)"/>
    <rect x="285" y="195" width="30" height="62" rx="3" fill="url(#green)"/>
    <rect x="345" y="145" width="30" height="60" rx="3" fill="url(#green)"/>

    <!-- Trend line -->
    <polyline points="120,355 180,310 240,270 300,225 360,170 420,130"
      fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="420" cy="130" r="6" fill="#4ade80"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="450" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" font-size="64" fill="#e6edf0" text-anchor="middle" letter-spacing="4">EDGE</text>
</svg>
